    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            getDocs,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8ixThMuTncx0LWw4kVFtJ4nOeTmq2iGc",
            authDomain: "designspartans-portfolio.firebaseapp.com",
            projectId: "designspartans-portfolio",
            storageBucket: "designspartans-portfolio.firebasestorage.app",
            messagingSenderId: "601370060723",
            appId: "1:601370060723:web:c3950c2abe2de4ae3b8dc6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let suppressNextTabUrlUpdate = false;

        function updateNoDataHeading(tabPaneId, title = "") {
            if (!title) {
                return;
            }

            const tabPane = document.getElementById(tabPaneId);
            const titleElement = tabPane?.querySelector("[data-no-data-title]");

            if (titleElement) {
                titleElement.textContent = title;
            }
        }

        window.changeTab = function (tabPaneId, subCategoryName = "", anchorId = "") {
            const triggerButton = document.querySelector(`[data-bs-target="#${tabPaneId}"]`);

            if (!triggerButton || !window.bootstrap?.Tab) {
                return;
            }

            updateNoDataHeading(tabPaneId, subCategoryName);

            window.bootstrap.Tab.getOrCreateInstance(triggerButton).show();

            if (anchorId) {
                window.requestAnimationFrame(() => {
                    window.requestAnimationFrame(() => {
                        document.getElementById(anchorId)?.scrollIntoView({
                            behavior: "auto",
                            block: "start"
                        });
                    });
                });
            }
        };

        function escapeHtml(value = "") {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeJsString(value = "") {
            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");
        }

        function slugify(value = "") {
            return String(value)
                .toLowerCase()
                .replace(/&/g, " and ")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
        }

        function sanitizeUrl(value = "#") {
            if (!value) {
                return "#";
            }

            const trimmedValue = String(value).trim();

            if (
                trimmedValue.startsWith("http://") ||
                trimmedValue.startsWith("https://") ||
                trimmedValue.startsWith("data:image/")
            ) {
                return trimmedValue;
            }

            return trimmedValue.startsWith("./") || trimmedValue.startsWith("/") ? trimmedValue : `https://${trimmedValue}`;
        }

        function getProjectDescription(project) {
            const candidates = [
                project.description,
                project.content,
                project.summary,
                project.details,
                project.shortDescription
            ];

            const description = candidates.find((value) => String(value || "").trim());
            return description || "Click the button below to visit this live project.";
        }

        function normalizeTimestamp(value) {
            if (!value) {
                return 0;
            }

            if (typeof value.toMillis === "function") {
                return value.toMillis();
            }

            if (value.seconds) {
                return value.seconds * 1000;
            }

            return 0;
        }

        function sortByCreatedAt(items) {
            return [...items].sort((a, b) => normalizeTimestamp(a.createdAt) - normalizeTimestamp(b.createdAt));
        }

        function normalizeSortOrder(value) {
            const numericValue = Number(value);
            return Number.isFinite(numericValue) ? numericValue : Number.MAX_SAFE_INTEGER;
        }

        function sortCategories(items) {
            return [...items].sort((a, b) => {
                const sortOrderDifference = normalizeSortOrder(a.sortOrder) - normalizeSortOrder(b.sortOrder);

                if (sortOrderDifference !== 0) {
                    return sortOrderDifference;
                }

                const createdAtDifference = normalizeTimestamp(a.createdAt) - normalizeTimestamp(b.createdAt);

                if (createdAtDifference !== 0) {
                    return createdAtDifference;
                }

                return String(a.name || "").localeCompare(String(b.name || ""));
            });
        }

        function getTabButtonId(categoryId) {
            return `tab-${categoryId}-button`;
        }

        function getTabPaneId(categoryId) {
            return `tab-${categoryId}-pane`;
        }

        function getCategoryTabSlug(category = {}) {
            return slugify(category.slug || category.name || category.id || "tab");
        }

        function getSubCategoryAnchorId(category = {}) {
            return slugify(category.id || category.slug || category.name || "category");
        }

        function updateTabUrl(tabSlug, options = {}) {
            if (!tabSlug) {
                return;
            }

            const { replace = false } = options;
            const url = new URL(window.location.href);

            url.searchParams.set("tab", tabSlug);

            const historyMethod = replace ? "replaceState" : "pushState";
            window.history[historyMethod]({}, "", `${url.pathname}${url.search}${url.hash}`);
        }

        function getRequestedTabSlug() {
            return normalizeValue(new URLSearchParams(window.location.search).get("tab"));
        }

        function getRequestedHashId() {
            return decodeURIComponent(window.location.hash.replace(/^#/, "")).trim();
        }

        function clearLocationHash() {
            const url = new URL(window.location.href);
            url.hash = "";
            window.history.replaceState({}, "", `${url.pathname}${url.search}`);
        }

        function scrollToRequestedHash(options = {}) {
            const requestedHashId = getRequestedHashId();

            if (!requestedHashId) {
                return false;
            }

            const targetElement = document.getElementById(requestedHashId);

            if (!targetElement) {
                return false;
            }

            window.requestAnimationFrame(() => {
                window.requestAnimationFrame(() => {
                    targetElement.scrollIntoView({
                        behavior: "auto",
                        block: "start"
                    });

                    if (options.clearHashAfterScroll) {
                        clearLocationHash();
                    }
                });
            });

            return true;
        }

        function activateTabFromUrl(options = {}) {
            const requestedTabSlug = getRequestedTabSlug();

            if (!requestedTabSlug || !window.bootstrap?.Tab) {
                return false;
            }

            const triggerButton = document.querySelector(`[data-tab-slug="${requestedTabSlug}"]`);

            if (!triggerButton) {
                return false;
            }

            const activeButton = document.querySelector('#myTab [data-bs-toggle="tab"].active');

            if (activeButton === triggerButton) {
                if (options.syncUrl) {
                    updateTabUrl(requestedTabSlug, { replace: true });
                }

                return true;
            }

            suppressNextTabUrlUpdate = true;
            window.bootstrap.Tab.getOrCreateInstance(triggerButton).show();

            if (options.syncUrl) {
                updateTabUrl(requestedTabSlug, { replace: true });
            }

            return true;
        }

        function initializeTabUrlSync(mainCategories = []) {
            const tabList = document.getElementById("myTab");

            if (!tabList) {
                return;
            }

            const defaultTabSlug = mainCategories.length ? getCategoryTabSlug(mainCategories[0]) : "";

            tabList.addEventListener("shown.bs.tab", (event) => {
                if (suppressNextTabUrlUpdate) {
                    suppressNextTabUrlUpdate = false;
                    return;
                }

                const tabSlug = event.target?.dataset?.tabSlug;

                if (tabSlug) {
                    updateTabUrl(tabSlug);
                }
            });

            window.addEventListener("popstate", () => {
                if (activateTabFromUrl()) {
                    return;
                }

                if (!defaultTabSlug || !window.bootstrap?.Tab) {
                    return;
                }

                const defaultTriggerButton = document.querySelector(`[data-tab-slug="${defaultTabSlug}"]`);

                if (defaultTriggerButton) {
                    suppressNextTabUrlUpdate = true;
                    window.bootstrap.Tab.getOrCreateInstance(defaultTriggerButton).show();
                }
            });

            if (activateTabFromUrl({ syncUrl: true })) {
                return;
            }

            if (defaultTabSlug) {
                updateTabUrl(defaultTabSlug, { replace: true });
            }
        }

        function normalizeValue(value = "") {
            return String(value || "").trim().toLowerCase();
        }

        function getCategoryLayout(category = {}, itemSource = "projects") {
            const configuredLayout = normalizeValue(
                category.layout ||
                category.layoutType ||
                category.displayType ||
                category.cardType ||
                category.variant
            );

            if (configuredLayout) {
                return configuredLayout;
            }

            return itemSource === "media" ? "gallery" : "default";
        }

        function createWebCard(project) {
            const imageUrl = sanitizeUrl(project.imageUrl);
            const rawTitle = String(project.title || project.name || "").trim();
            const shouldShowTitle = rawTitle && rawTitle.toLowerCase() !== "untitled project";
            const title = shouldShowTitle ? escapeHtml(rawTitle) : "";
            const rawLink = String(project.link || "").trim();
            const hasLink = Boolean(rawLink);
            const linkUrl = hasLink ? sanitizeUrl(rawLink) : "";
            const description = escapeHtml(getProjectDescription(project));
            const imageAlt = title || "Project image";
            const imageMarkup = `<img src="${imageUrl}" class="card-img img-fluid" alt="${imageAlt}">`;
            const modalTriggerAttributes = `
                href="#"
                class="project-modal-trigger"
                data-bs-toggle="modal"
                data-bs-target="#modalShow"
                data-project-title="${title || "Project Preview"}"
                data-project-image="${escapeHtml(imageUrl)}"
                data-project-description="${description}"
                data-project-link="${hasLink ? escapeHtml(linkUrl) : ""}"
            `;
            const titleMarkup = shouldShowTitle ? `<h4 class="card-title">${title}</h4>` : "";
            const imageContent = hasLink
                ? `<a ${modalTriggerAttributes} aria-label="${title || "Project Preview"}">${imageMarkup}</a>`
                : imageMarkup;
            const titleContent = shouldShowTitle
                ? hasLink
                    ? `<a ${modalTriggerAttributes} style="text-decoration: none;" aria-label="${title}">${titleMarkup}</a>`
                    : titleMarkup
                : "";
            const linkCheckAttr = hasLink ? ` data-link-check="${escapeHtml(linkUrl)}"` : "";

            return `
                <div class="col-md-4 col-lg-4 col-sm-6 web-box"${linkCheckAttr}>
                    <div class="box">
                        ${imageContent}
                        <div class="card-body">
                            ${titleContent}
                        </div>
                    </div>
                </div>
            `;
        }

        function createBusinessCard(project, index) {
            const imageUrl = sanitizeUrl(project.imageUrl);
            const rawTitle = String(project.title || project.name || "").trim();
            const normalizedTitle = rawTitle && rawTitle.toLowerCase() !== "untitled project"
                ? rawTitle
                : "Business Card";
            const title = escapeHtml(normalizedTitle);
            const description = escapeHtml(getProjectDescription(project));
            const rawLink = String(project.link || "").trim();
            const hasLink = Boolean(rawLink);
            const linkUrl = hasLink ? sanitizeUrl(rawLink) : "";
            const imageMarkup = `<img class="img-thumbnail" src="${imageUrl}" alt="${title}">`;
            const modalTriggerAttributes = `
                href="#"
                class="thumbnail project-modal-trigger"
                data-bs-toggle="modal"
                data-bs-target="#modalShow"
                data-image-id="${escapeHtml(project.id || String(index + 1))}"
                data-toggle="modal"
                data-title="${title}"
                data-project-title="${title}"
                data-project-image="${escapeHtml(imageUrl)}"
                data-project-description="${description}"
                data-project-link="${hasLink ? escapeHtml(linkUrl) : ""}"
                aria-label="${title}"
            `;
            const imageContent = hasLink
                ? `<a ${modalTriggerAttributes}>${imageMarkup}</a>`
                : imageMarkup;

            return `
                <div class="col-lg-4 col-md-4 col-xs-6 thumb">
                    ${imageContent}
                </div>
            `;
        }

        function createLogoCard(project, index) {
            const imageUrl = sanitizeUrl(project.imageUrl);
            const rawTitle = String(project.title || project.name || "").trim();
            const normalizedTitle = rawTitle && rawTitle.toLowerCase() !== "untitled project"
                ? rawTitle
                : "Logo";
            const title = escapeHtml(normalizedTitle);
            const description = escapeHtml(getProjectDescription(project));
            const rawLink = String(project.link || "").trim();
            const hasLink = Boolean(rawLink);
            const linkUrl = hasLink ? sanitizeUrl(rawLink) : "";
            const imageMarkup = `<img class="img-thumbnail" src="${imageUrl}" alt="${title}">`;
            const modalTriggerAttributes = `
                href="#"
                class="thumbnail project-modal-trigger"
                data-bs-toggle="modal"
                data-bs-target="#modalShow"
                data-image-id="${escapeHtml(project.id || String(index + 1))}"
                data-toggle="modal"
                data-title="${title}"
                data-project-title="${title}"
                data-project-image="${escapeHtml(imageUrl)}"
                data-project-description="${description}"
                data-project-link="${hasLink ? escapeHtml(linkUrl) : ""}"
                aria-label="${title}"
            `;
            const imageContent = hasLink
                ? `<a ${modalTriggerAttributes}>${imageMarkup}</a>`
                : imageMarkup;

            return `
                <div class="col-lg-3 col-md-4 col-xs-6 thumb">
                    ${imageContent}
                </div>
            `;
        }

        function createMobileAppCard(project, index) {
            const imageUrl = sanitizeUrl(project.imageUrl);
            const rawTitle = String(project.title || project.name || "").trim();
            const normalizedTitle = rawTitle && rawTitle.toLowerCase() !== "untitled project"
                ? rawTitle
                : "Mobile App";
            const title = escapeHtml(normalizedTitle);
            const description = escapeHtml(getProjectDescription(project));
            const rawLink = String(project.link || "").trim();
            const hasLink = Boolean(rawLink);
            const linkUrl = hasLink ? sanitizeUrl(rawLink) : "";
            const imageMarkup = `<img src="${imageUrl}" class="w-100 shadow-1-strong" alt="${title}">`;
            const modalTriggerAttributes = `
                href="#"
                class="project-modal-trigger mobile-app-trigger"
                data-bs-toggle="modal"
                data-bs-target="#modalShow"
                data-image-id="${escapeHtml(project.id || String(index + 1))}"
                data-toggle="modal"
                data-title="${title}"
                data-project-title="${title}"
                data-project-image="${escapeHtml(imageUrl)}"
                data-project-description="${description}"
                data-project-link="${hasLink ? escapeHtml(linkUrl) : ""}"
                aria-label="${title}"
            `;
            const imageContent = hasLink
                ? `<a ${modalTriggerAttributes}>${imageMarkup}</a>`
                : imageMarkup;

            return `
                <div class="col-md-4 mb-4">
                    <div class="img-container">
                        ${imageContent}
                    </div>
                </div>
            `;
        }

        function createRows(cards, perRow = 3) {
            const rows = [];

            for (let i = 0; i < cards.length; i += perRow) {
                rows.push(`<div class="row justify-content-center">${cards.slice(i, i + perRow).join("")}</div>`);
            }

            return rows.join("");
        }

        function renderTopContent(primaryContent) {
            const logoElement = document.getElementById("portfolio-logo");
            const faviconElement = document.getElementById("site-favicon");
            const titleElement = document.getElementById("portfolio-title");
            const descriptionElement = document.getElementById("portfolio-description");

            if (!logoElement || !titleElement || !descriptionElement) {
                return;
            }

            if (!primaryContent) {
                descriptionElement.textContent = "No data found.";
                return;
            }

            logoElement.src = primaryContent.logoUrl || "";

            if (faviconElement) {
                faviconElement.href = primaryContent.logoUrl || "";
            }

            if (primaryContent.title) {
                titleElement.textContent = primaryContent.title;
            }

            descriptionElement.textContent = primaryContent.content || "No data found.";
        }

        function renderNoDataState(tabPaneId, title = "") {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            const titleMarkup = title
                ? `<h2 class="title-bg" data-no-data-title style="background-image: url('images/title-bg.svg');">${escapeHtml(title)}</h2>`
                : "";

            tabPane.innerHTML = `
                <div class="container text-center py-5">
                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            ${titleMarkup}
                            <p class="p mb-0">No data available for this section right now.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDropdownNoData(dropdownId) {
            const dropdown = document.getElementById(dropdownId);

            if (!dropdown) {
                return;
            }

            dropdown.innerHTML = `
                <div class="row">
                    <div class="col">
                        <li><span class="dropdown-item">No data found</span></li>
                    </div>
                </div>
            `;
        }

        function renderTabs(mainCategories, categoriesWithDropdown = new Set()) {
            const tabList = document.getElementById("myTab");
            const tabContent = document.getElementById("myTabContent");

            if (!tabList || !tabContent) {
                return;
            }

            tabList.innerHTML = mainCategories.map((category, index) => {
                const buttonId = getTabButtonId(category.id);
                const paneId = getTabPaneId(category.id);
                const tabSlug = getCategoryTabSlug(category);
                const isActive = index === 0;
                const hasDropdown = categoriesWithDropdown.has(category.id);

                if (hasDropdown) {
                    return `
                        <li class="nav-item btn-group" role="presentation">
                            <button type="button" class="nav-link dynamic-web-tab ${isActive ? "active" : ""}" id="${buttonId}" data-category-name="${escapeHtml(category.name)}"
                                data-bs-toggle="tab" data-bs-target="#${paneId}" data-tab-slug="${tabSlug}" role="tab" aria-controls="${paneId}" aria-selected="${isActive}">
                                ${escapeHtml(category.name)}
                            </button>
                            <button type="button" class="btn btn-danger dropdown-toggle dropdown-toggle-split"
                                data-bs-toggle="dropdown" aria-expanded="false"></button>
                            <ul class="dropdown-menu dropdown-menu-lg" id="dropdown-${category.id}"></ul>
                        </li>
                    `;
                }

                return `
                    <li class="nav-item btn-group" role="presentation">
                        <button class="nav-link ${isActive ? "active" : ""}" id="${buttonId}" data-bs-toggle="tab" data-tab-slug="${tabSlug}"
                            data-bs-target="#${paneId}" type="button" role="tab" aria-controls="${paneId}" aria-selected="${isActive}">
                            ${escapeHtml(category.name)}
                        </button>
                    </li>
                `;
            }).join("");

            tabContent.innerHTML = mainCategories.map((category, index) => {
                const paneId = getTabPaneId(category.id);
                const buttonId = getTabButtonId(category.id);
                const isActive = index === 0;

                return `
                    <div class="tab-pane ${isActive ? "show active" : ""}" id="${paneId}" role="tabpanel" aria-labelledby="${buttonId}" tabindex="0"></div>
                `;
            }).join("");
        }

        function initializeDynamicPlaceholders(mainCategories, categoriesWithDropdown = new Set()) {
            renderTabs(mainCategories, categoriesWithDropdown);
            mainCategories.forEach((category) => {
                const paneId = getTabPaneId(category.id);
                renderNoDataState(paneId, category.name);

                if (categoriesWithDropdown.has(category.id)) {
                    renderDropdownNoData(`dropdown-${category.id}`);
                }
            });
        }

        function renderCategoryDropdown(dropdownId, tabPaneId, subCategories) {
            const dropdown = document.getElementById(dropdownId);

            if (!dropdown) {
                return;
            }

            const items = subCategories.map((category) => {
                const anchorId = getSubCategoryAnchorId(category);
                const name = escapeHtml(String(category.name || "").toUpperCase());

                return `
                    <li>
                        <a class="dropdown-item" href="#${anchorId}" onclick="changeTab('${tabPaneId}', '${escapeJsString(category.name)}', '${escapeJsString(anchorId)}')">${name}</a>
                    </li>
                `;
            });

            const columns = [];

            for (let i = 0; i < items.length; i += 4) {
                columns.push(`<div class="col">${items.slice(i, i + 4).join("")}</div>`);
            }

            const rows = [];

            for (let i = 0; i < columns.length; i += 4) {
                rows.push(`<div class="row">${columns.slice(i, i + 4).join("")}</div>`);
            }

            dropdown.innerHTML = rows.join("") || dropdown.innerHTML;
        }

        function renderSubCategorySections(tabPaneId, subCategories, items) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            const sections = subCategories
                .map((category) => {
                    const relatedItems = sortByCreatedAt(
                        items.filter((item) => {
                            const itemSubCategoryId = item.subCategoryId || item.categoryId;
                            const itemSubCategoryName = item.subCategoryName || item.categoryName;

                            return itemSubCategoryId === category.id || itemSubCategoryName === category.name;
                        })
                    );

                    if (!relatedItems.length) {
                        return "";
                    }

                    const cards = relatedItems.map(createWebCard);
                    const anchorId = getSubCategoryAnchorId(category);

                    return `
                        <div class="link-check-subsection">
                            <h2 class="title-bg" id="${anchorId}" style="background-image: url('images/title-bg.svg');">
                                ${escapeHtml(category.name)}
                            </h2>
                            ${createRows(cards)}
                        </div>
                    `;
                })
                .filter(Boolean)
                .join("");

            if (!sections) {
                return;
            }

            tabPane.innerHTML = `
                <div class="container text-center">
                    ${sections}
                </div>
            `;
        }

        function renderTypedSubCategorySections(tabPaneId, subCategories, items, options = {}) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            const {
                cardRenderer = createWebCard,
                rowClass = "",
                wrapperClass = "",
                perRow = 3
            } = options;

            const sections = subCategories
                .map((category) => {
                    const relatedItems = sortByCreatedAt(
                        items.filter((item) => {
                            const itemSubCategoryId = item.subCategoryId || item.categoryId;
                            const itemSubCategoryName = item.subCategoryName || item.categoryName;

                            return itemSubCategoryId === category.id || itemSubCategoryName === category.name;
                        })
                    );

                    if (!relatedItems.length) {
                        return "";
                    }

                    const cards = relatedItems.map((item, index) => cardRenderer(item, index));
                    const sectionBody = rowClass
                        ? `<div class="row ${rowClass}">${cards.join("")}</div>`
                        : createRows(cards, perRow);
                    const anchorId = getSubCategoryAnchorId(category);

                    return `
                        <h2 class="title-bg" id="${anchorId}" style="background-image: url('images/title-bg.svg');">
                            ${escapeHtml(category.name)}
                        </h2>
                        ${sectionBody}
                    `;
                })
                .filter(Boolean)
                .join("");

            if (!sections) {
                return;
            }

            tabPane.innerHTML = `
                <div class="${wrapperClass || "container text-center py-4"}">
                    ${sections}
                </div>
            `;
        }

        function createGalleryGridItem(project, index) {
            const imageUrl = sanitizeUrl(project.imageUrl);
            const rawTitle = String(project.title || project.name || "").trim();
            const title = escapeHtml(rawTitle || `Project ${index + 1}`);
            const description = escapeHtml(getProjectDescription(project));
            const rawLink = String(project.link || "").trim();
            const hasLink = Boolean(rawLink);
            const linkUrl = hasLink ? sanitizeUrl(rawLink) : "";

            return `
                <li class="shown">
                    <a
                        href="#"
                        class="project-modal-trigger"
                        data-bs-toggle="modal"
                        data-bs-target="#modalShow"
                        data-project-title="${title}"
                        data-project-image="${escapeHtml(imageUrl)}"
                        data-project-description="${description}"
                        data-project-link="${hasLink ? escapeHtml(linkUrl) : ""}"
                        aria-label="${title}"
                    >
                        <img src="${imageUrl}" alt="${title}">
                    </a>
                </li>
            `;
        }

        function renderMerchandizingSubCategorySections(tabPaneId, categoryId, subCategories, items) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            const sections = subCategories
                .map((category) => {
                    const relatedItems = sortByCreatedAt(
                        items.filter((item) => {
                            const itemSubCategoryId = item.subCategoryId || item.categoryId;
                            const itemSubCategoryName = item.subCategoryName || item.categoryName;

                            return itemSubCategoryId === category.id || itemSubCategoryName === category.name;
                        })
                    );

                    if (!relatedItems.length) {
                        return "";
                    }

                    const gridId = `grid-${categoryId}-${slugify(category.name)}`;
                    const gridItems = relatedItems.map(createGalleryGridItem).join("");
                    const anchorId = getSubCategoryAnchorId(category);

                    return `
                        <h2 class="title-bg" id="${anchorId}" style="background-image: url('images/title-bg.svg');">
                            ${escapeHtml(category.name)}
                        </h2>
                        <ul class="grid effect-1 merch-grid" id="${gridId}">
                            ${gridItems}
                        </ul>
                    `;
                })
                .filter(Boolean)
                .join("");

            if (!sections) {
                return;
            }

            tabPane.innerHTML = `
                <div class="container text-center">
                    ${sections}
                </div>
            `;

            if (typeof window.gallerySet === "function") {
                tabPane.querySelectorAll(".grid").forEach((gridElement) => window.gallerySet(gridElement));
            }
        }

        function renderGenericProjects(tabPaneId, projects) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            if (!projects.length) {
                renderNoDataState(tabPaneId);
                return;
            }

            const cards = sortByCreatedAt(projects).map(createWebCard);

            tabPane.innerHTML = `
                <div class="container text-center py-4">
                    ${createRows(cards)}
                </div>
            `;
        }

        function renderBusinessCardProjects(tabPaneId, projects) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            if (!projects.length) {
                renderNoDataState(tabPaneId);
                return;
            }

            const cards = sortByCreatedAt(projects).map(createBusinessCard).join("");

            tabPane.innerHTML = `
                <div class="business-card-pane">
                    <div class="container pt-5">
                        <div class="row">
                            ${cards}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLogoProjects(tabPaneId, projects) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            if (!projects.length) {
                renderNoDataState(tabPaneId);
                return;
            }

            const cards = sortByCreatedAt(projects).map(createLogoCard);

            tabPane.innerHTML = `
                <div class="logo-pane container">
                    ${createRows(cards, 4)}
                </div>
            `;
        }

        function renderMobileAppProjects(tabPaneId, projects) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane) {
                return;
            }

            if (!projects.length) {
                renderNoDataState(tabPaneId);
                return;
            }

            const cards = sortByCreatedAt(projects).map(createMobileAppCard).join("");

            tabPane.innerHTML = `
                <div class="mobile-app-pane container pt-5 text-center">
                    <div class="row">
                        ${cards}
                    </div>
                </div>
            `;
        }

        function renderGalleryProjects(tabPaneId, projects) {
            const tabPane = document.getElementById(tabPaneId);

            if (!tabPane || !projects.length) {
                return;
            }

            const items = sortByCreatedAt(projects)
                .map(createGalleryGridItem)
                .join("");

            tabPane.innerHTML = `
                <ul class="grid effect-1" id="grid-${tabPaneId}">
                    ${items}
                </ul>
            `;

            if (typeof window.gallerySet === "function") {
                const grid = tabPane.querySelector(".grid");

                if (grid) {
                    window.gallerySet(grid);
                }
            }
        }

        function renderCategoryProjects(tabPaneId, projects, layout = "default") {
            switch (layout) {
                case "business-card":
                case "businesscard":
                case "business-cards":
                    renderBusinessCardProjects(tabPaneId, projects);
                    return;
                case "logo":
                case "logos":
                case "logo-design":
                case "logo-designs":
                    renderLogoProjects(tabPaneId, projects);
                    return;
                case "mobile-app":
                case "mobile-apps":
                case "app-design":
                case "app-designs":
                    renderMobileAppProjects(tabPaneId, projects);
                    return;
                case "gallery":
                case "masonry":
                case "media":
                    renderGalleryProjects(tabPaneId, projects);
                    return;
                default:
                    renderGenericProjects(tabPaneId, projects);
            }
        }

        function renderCategorySubSections(tabPaneId, categoryId, subCategories, items, layout = "default") {
            switch (layout) {
                case "gallery":
                case "masonry":
                case "media":
                    renderMerchandizingSubCategorySections(tabPaneId, categoryId, subCategories, items);
                    return;
                case "business-card":
                case "businesscard":
                case "business-cards":
                    renderTypedSubCategorySections(tabPaneId, subCategories, items, {
                        cardRenderer: createBusinessCard,
                        rowClass: "",
                        wrapperClass: "business-card-pane"
                    });
                    return;
                case "logo":
                case "logos":
                case "logo-design":
                case "logo-designs":
                    renderTypedSubCategorySections(tabPaneId, subCategories, items, {
                        cardRenderer: createLogoCard,
                        rowClass: "",
                        wrapperClass: "logo-pane container"
                    });
                    return;
                case "mobile-app":
                case "mobile-apps":
                case "app-design":
                case "app-designs":
                    renderTypedSubCategorySections(tabPaneId, subCategories, items, {
                        cardRenderer: createMobileAppCard,
                        rowClass: "",
                        wrapperClass: "mobile-app-pane container pt-5 text-center"
                    });
                    return;
                default:
                    renderSubCategorySections(tabPaneId, subCategories, items);
            }
        }

        async function fetchCollection(collectionName) {
            const collectionRef = collection(db, collectionName);

            try {
                const snapshot = await getDocs(query(collectionRef, orderBy("createdAt", "asc")));
                return snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
            } catch (error) {
                const snapshot = await getDocs(collectionRef);
                return snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
            }
        }

        const LINK_CHECK_TIMEOUT_MS = 6000;
        const LINK_CHECK_MAX_ATTEMPTS = 3;
        const LINK_CHECK_RETRY_DELAY_MS = 800;

        function attemptLinkCheck(url) {
            return new Promise((resolve) => {
                const controller = new AbortController();
                const timer = setTimeout(() => {
                    controller.abort();
                    resolve(false);
                }, LINK_CHECK_TIMEOUT_MS);

                fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal })
                    .then(() => {
                        clearTimeout(timer);
                        resolve(true);
                    })
                    .catch(() => {
                        clearTimeout(timer);
                        resolve(false);
                    });
            });
        }

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        async function checkLinkReachable(url) {
            for (let attempt = 1; attempt <= LINK_CHECK_MAX_ATTEMPTS; attempt += 1) {
                if (await attemptLinkCheck(url)) {
                    return true;
                }

                if (attempt < LINK_CHECK_MAX_ATTEMPTS) {
                    await wait(LINK_CHECK_RETRY_DELAY_MS);
                }
            }

            return false;
        }

        async function verifyProjectLinks() {
            const cards = Array.from(document.querySelectorAll("[data-link-check]"));

            await Promise.all(cards.map(async (card) => {
                const url = card.getAttribute("data-link-check");
                const isReachable = url && await checkLinkReachable(url);

                if (!isReachable) {
                    card.classList.add("d-none");
                }
            }));

            hideEmptyLinkCheckSections();
        }

        function hideEmptyLinkCheckSections() {
            document.querySelectorAll(".link-check-subsection").forEach((section) => {
                if (!section.querySelector(".web-box:not(.d-none)")) {
                    section.classList.add("d-none");
                }
            });

            document.querySelectorAll(".tab-pane").forEach((tabPane) => {
                const cards = tabPane.querySelectorAll(".web-box");

                if (!cards.length || tabPane.querySelector(".web-box:not(.d-none)")) {
                    return;
                }

                const button = document.getElementById(tabPane.id.replace(/-pane$/, "-button"));
                renderNoDataState(tabPane.id, button ? button.textContent.trim() : "");
            });
        }

        async function fetchDocument(collectionName, documentId) {
            const documentRef = doc(db, collectionName, documentId);
            const snapshot = await getDoc(documentRef);

            if (!snapshot.exists()) {
                return null;
            }

            return { id: snapshot.id, ...snapshot.data() };
        }

        async function fetchTopContent() {
            return fetchDocument("topContent", "primary");
        }

        const PORTFOLIO_CACHE_KEY = "designspartans-portfolio-cache-v1";
        const PORTFOLIO_CACHE_TTL_MS = 15 * 60 * 1000;

        function readPortfolioCache() {
            try {
                const raw = localStorage.getItem(PORTFOLIO_CACHE_KEY);

                if (!raw) {
                    return null;
                }

                const parsed = JSON.parse(raw);

                if (!parsed || typeof parsed.timestamp !== "number") {
                    return null;
                }

                if (Date.now() - parsed.timestamp > PORTFOLIO_CACHE_TTL_MS) {
                    return null;
                }

                return parsed.data;
            } catch (error) {
                return null;
            }
        }

        function writePortfolioCache(data) {
            try {
                localStorage.setItem(PORTFOLIO_CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data }));
            } catch (error) {
                // Caching is a non-critical optimization; ignore storage errors (quota, privacy mode, etc).
            }
        }

        async function fetchPortfolioData() {
            const [categories, projects, media, topContent] = await Promise.all([
                fetchCollection("categories"),
                fetchCollection("projects"),
                fetchCollection("media"),
                fetchTopContent()
            ]);

            return { categories, projects, media, topContent };
        }

        function renderPortfolio({ categories, projects, media, topContent }) {
            renderTopContent(topContent);

            const mainCategories = categories.filter((category) => !category.parentId);
            const orderedMainCategories = sortCategories(mainCategories);

            if (!orderedMainCategories.length) {
                document.getElementById("myTab").innerHTML = "";
                document.getElementById("myTabContent").innerHTML = `
                    <div class="tab-pane show active">
                        <div class="container text-center py-5">
                            <h2 class="title-bg" style="background-image: url('images/title-bg.svg');">No data found</h2>
                            <p class="p mb-0">No categories available right now.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const categoriesWithDropdown = new Set(
                orderedMainCategories
                    .filter((category) => categories.some((item) => item.parentId === category.id))
                    .map((category) => category.id)
            );

            initializeDynamicPlaceholders(orderedMainCategories, categoriesWithDropdown);
            initializeTabUrlSync(orderedMainCategories);

            orderedMainCategories.forEach((category) => {
                const tabPaneId = getTabPaneId(category.id);
                const subCategories = sortCategories(
                    categories.filter((item) => item.parentId === category.id)
                );
                const categoryProjects = projects.filter((project) => {
                    return (
                        project.mainCategoryId === category.id ||
                        project.mainCategoryName === category.name
                    );
                });
                const categoryMedia = media.filter((item) => {
                    return (
                        item.mainCategoryId === category.id ||
                        item.mainCategoryName === category.name ||
                        item.categoryId === category.id ||
                        item.categoryName === category.name
                    );
                });
                const itemSource = categoryMedia.length ? "media" : "projects";
                const categoryItems = itemSource === "media" ? categoryMedia : categoryProjects;
                const categoryLayout = getCategoryLayout(category, itemSource);

                if (subCategories.length) {
                    renderCategoryDropdown(`dropdown-${category.id}`, tabPaneId, subCategories);

                    if (categoryItems.length) {
                        renderCategorySubSections(tabPaneId, category.id, subCategories, categoryItems, categoryLayout);
                    } else {
                        renderNoDataState(tabPaneId, subCategories[0]?.name || category.name);
                    }

                    return;
                }

                renderCategoryProjects(tabPaneId, categoryItems, categoryLayout);
            });

            verifyProjectLinks();
            scrollToRequestedHash({ clearHashAfterScroll: true });
        }

        async function loadPortfolioData() {
            try {
                const cachedData = readPortfolioCache();
                const data = cachedData || await fetchPortfolioData();

                if (!cachedData) {
                    writePortfolioCache(data);
                }

                renderPortfolio(data);
            } catch (error) {
                console.error("Failed to load portfolio data from Firestore.", error);
            } finally {
                document.documentElement.classList.remove('dynamic-portfolio-pending');
                document.body.classList.add('page-loaded');
            }
        }

        loadPortfolioData();
    </script>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./gallery-assets/masonry.pkgd.min.js"></script>
    <script src="./gallery-assets/imagesloaded.js"></script>
    <script src="./gallery-assets/classie.js"></script>
    <script src="./gallery-assets/AnimOnScroll.js"></script>

    <script>
        function getActiveGrid() {
            return document.querySelector('.tab-pane.active .grid') || document.querySelector('.grid');
        }

        function gallerySet(gridElement = getActiveGrid()) {
            if (!gridElement) {
                return;
            }

            new AnimOnScroll(gridElement, {
                minDuration: 0.4,
                maxDuration: 0.7,
                viewportFactor: 0.2
            });
        }

        $(document).ready(function () {
            $(document).on('click', '.project-modal-trigger', function (e) {
                e.preventDefault();

                const title = $(this).attr('data-project-title') || 'Project Preview';
                const description = $(this).attr('data-project-description') || 'Project details will appear here.';
                const image = $(this).attr('data-project-image') || '';
                const link = $(this).attr('data-project-link') || '';

                $('#projectModalTitle').text(title);
                $('#projectModalDescription').text(description);
                $('#projectModalImage').attr('src', image).attr('alt', title);

                const $button = $('#projectModalButton');
                if (link) {
                    $button.attr('href', link).removeClass('d-none');
                } else {
                    $button.attr('href', '#').addClass('d-none');
                }
            });

            $(document).on('click', 'a[data-bs-target="#modalShow"]:not(.project-modal-trigger)', function () {
                var src = $('img', this).attr('src');
                if (src) {
                    $('#modalShow .modal-body img').attr('src', src);
                }
            });

        })



    </script>
